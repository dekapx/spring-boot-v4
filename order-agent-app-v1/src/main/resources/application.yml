server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/order-agent}

spring:
  application:
    name: order-agent

  datasource:
    username: ${POSTGRES_USERNAME:testuser}
    password: ${POSTGRES_PASSWORD:testpassword}
    url: jdbc:postgresql://localhost:5432/testdb
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # Ensures data.sql runs AFTER Hibernate creates the schema (ddl-auto: update)
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  sql:
    init:
      mode: always
      platform: postgres
      continue-on-error: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

# Ollama (local LLM) settings
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:gemma4:31b}
  timeout-seconds: 120

logging:
  level:
    com.example.orderagent: INFO
    org.hibernate.SQL: WARN
