version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: order-agent-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - order-agent-pgdata:/var/lib/postgresql/data

volumes:
  order-agent-pgdata:
