server:
  port: 8080

spring:
  application:
    name: spring-ai-chat-app
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3-coder:30b}
          temperature: 0.7
          num-predict: 2048

logging:
  level:
    com.dekapx.apps: INFO
